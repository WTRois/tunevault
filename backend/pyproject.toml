[project]
name = "backend"
version = "0.1.0"
description = "TuneVault Backend Service"
readme = "README.md"
authors = [
    { name = "Muhammad Rois Akbar", email = "129079350+WTRois@users.noreply.github.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "httpx>=0.27.0",
    "uvicorn[standard]>=0.30.0",
    "sqlmodel>=0.0.22",
    "alembic>=1.14.0",
    "mutagen>=1.47.0",
    "librosa>=0.10.2",
    "openpyxl>=3.1.5",
    "pandas>=2.2.0",
    "pillow>=10.4.0",
    "pydantic-settings>=2.4.0",
    "loguru>=0.7.2",
    "yt-dlp>=2024.8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "httpx>=0.27.0",
    "ruff>=0.9.0",
]

[project.scripts]
backend = "backend.main:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
ignore = ["B008"]
